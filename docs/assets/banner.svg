<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">VainSabers Quest</title><desc id="desc">Cyan and pink sabers against a dark background. Custom sabers, motion blur and a preset editor.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080c20"/><stop offset="1" stop-color="#17102c"/></linearGradient>
    <linearGradient id="trail"><stop stop-color="#e147ac" stop-opacity="0"/><stop offset="1" stop-color="#e147ac" stop-opacity=".3"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <g stroke="#313650" stroke-opacity=".4"><path d="M0 260H1200M0 280H1200M0 300H1200M760 0V320M850 0V320M940 0V320M1030 0V320M1120 0V320"/></g>
  <path d="M730 65Q925 65 1060 250Q840 215 730 65" fill="url(#trail)"/>
  <g transform="rotate(-30 975 180)"><rect x="968" y="35" width="14" height="210" rx="7" fill="#00c8f8" filter="url(#glow)"/><rect x="971" y="35" width="8" height="210" rx="4" fill="#bff9ff"/><rect x="963" y="245" width="24" height="46" rx="6" fill="#147c9d"/><rect x="963" y="244" width="24" height="5" rx="2" fill="#fff"/></g>
  <g transform="rotate(28 965 180)"><rect x="958" y="30" width="14" height="210" rx="7" fill="#e147ac" filter="url(#glow)"/><rect x="961" y="30" width="8" height="210" rx="4" fill="#ffcaee"/><rect x="953" y="240" width="24" height="46" rx="6" fill="#9f286e"/><rect x="953" y="239" width="24" height="5" rx="2" fill="#fff"/></g>
  <text x="62" y="75" fill="#00c8f8" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="5">BEAT SABER · STANDALONE QUEST</text>
  <text x="58" y="158" fill="#f3f6ff" font-family="Arial, sans-serif" font-size="66" font-weight="800">VainSabers</text>
  <text x="63" y="206" fill="#aeb7d5" font-family="Arial, sans-serif" font-size="24">Custom sabers. Motion blur. Your own style.</text>
  <rect x="62" y="245" width="158" height="34" rx="17" fill="#00c8f8" fill-opacity=".12" stroke="#00c8f8" stroke-opacity=".45"/>
  <text x="141" y="267" text-anchor="middle" fill="#74e1ff" font-family="Arial, sans-serif" font-size="14" font-weight="700">QUEST PORT 07</text>
  <text x="241" y="267" fill="#9c9cb4" font-family="Arial, sans-serif" font-size="14">Original mod by Vainstains</text>
</svg>
